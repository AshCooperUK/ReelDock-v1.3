# CasaOS template for the versioned image published by this repository.
# Fresh installation with a fixed Compose-managed media layout.
# Keep host paths literal for compatibility with the CasaOS volume importer.
name: reeldock-v13

x-app-environment: &app-environment
  # Optional: pre-fills the public HTTPS address on the setup page.
  APP_URL: ""
  # Host-side port; the container itself always listens on 8790.
  APP_PORT: "8821"
  # Trust only the exact LAN addresses collected by prepare-storage on this server.
  LOCAL_SETUP_URL: ""
  REELDOCK_AUTO_LAN_SETUP: "1"
  REELDOCK_HOST_ROOT: /DATA/Media/reeldock-v13/data
  REELDOCK_MEDIA_ROOT: /reeldock
  DATA_DIR: /data
  REELDOCK_VPN_TRANSPORT: "1"
  LD_PRELOAD: /usr/local/lib/reeldock_socket_mark.so
  TZ: Europe/London
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

x-app-volumes: &app-volumes
  - type: bind
    source: /DATA/AppData/reeldock-v13/vpn-run
    target: /vpn-run
    read_only: true
  - type: bind
    source: /DATA/Media/reeldock-v13/data
    target: /reeldock
  - type: bind
    source: /DATA/AppData/reeldock-v13/data
    target: /data

services:
  vpn:
    image: ghcr.io/ashcooperuk/reeldock-v1.3:1.3.10
    container_name: reeldock-v13-vpn
    user: "0:0"
    restart: unless-stopped
    command: ["python", "-m", "runtime.vpn.gateway"]
    ports:
      - target: 8790
        published: "8821"
        protocol: tcp
    dns: ["127.0.0.1"]
    environment:
      REELDOCK_PRIVADO_API_KEY: "${REELDOCK_PRIVADO_API_KEY:-}"
    volumes:
      - type: bind
        source: /DATA/AppData/reeldock-v13/vpn-state
        target: /vpn-state
      - type: bind
        source: /DATA/AppData/reeldock-v13/vpn-run
        target: /vpn-run
    depends_on:
      prepare-storage:
        condition: service_completed_successfully
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/vpn-run/control.sock'); s.sendall(b'{\"action\":\"status\"}\\n'); assert s.recv(65536)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  web:
    image: ghcr.io/ashcooperuk/reeldock-v1.3:1.3.10
    restart: unless-stopped
    network_mode: "service:vpn"
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      vpn:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1.00"

  worker:
    image: ghcr.io/ashcooperuk/reeldock-v1.3:1.3.10
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    network_mode: "service:vpn"
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      vpn:
        condition: service_healthy
      web:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
    # ZimaOS reports an app update as failed when the worker has no healthcheck.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sqlite3, time; from pathlib import Path;
          path = Path(os.environ.get('DATA_DIR', '/data')) / 'reeldock.sqlite3';
          db = sqlite3.connect(path.resolve().as_uri() + '?mode=ro', uri=True, timeout=2);
          row = db.execute("SELECT value FROM settings WHERE key='worker_heartbeat'").fetchone();
          db.close();
          assert row and float(row[0]) > time.time() - 120, 'Worker heartbeat is missing or stale'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: "1.00"

  prepare-storage:
    image: ghcr.io/ashcooperuk/reeldock-v1.3:1.3.10
    user: "0:0"
    network_mode: host
    restart: on-failure:1
    entrypoint: ["python", "-c"]
    command:
      - "import os, subprocess, sys; [os.chown(p,10001,10001) for p in ('/data','/reeldock')]; os.chmod('/data',0o700); [os.chown(p,0,0) for p in ('/vpn-run','/vpn-state')]; os.chmod('/vpn-run',0o755); os.chmod('/vpn-state',0o700); subprocess.run([sys.executable,'-m','backend.lan_setup'],check=True)"
    volumes:
      - type: bind
        source: /DATA/AppData/reeldock-v13/vpn-run
        target: /vpn-run
      - type: bind
        source: /DATA/AppData/reeldock-v13/vpn-state
        target: /vpn-state
      - type: bind
        source: /DATA/Media/reeldock-v13/data
        target: /reeldock
      - type: bind
        source: /DATA/AppData/reeldock-v13/data
        target: /data
      - type: bind
        source: /etc/hostname
        target: /host/etc/hostname
        read_only: true
      - type: bind
        source: /etc/hosts
        target: /host/etc/hosts
        read_only: true
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]

x-casaos:
  architectures: [amd64]
  # Public versioned artwork works from the browser before setup is complete.
  icon: https://raw.githubusercontent.com/AshCooperUK/ReelDock-v1.3/v1.3.10/frontend/public/assets/reeldock-brand.svg
  main: web
  port_map: "8821"
  scheme: http
  hostname: ""
  index: /setup
  title:
    en_US: ReelDock V1.3
  category: Media
  version: v1.3.10
  tagline:
    en_US: Your media. In one place.
  description:
    en_US: ReelDock media discovery, downloads, TV guide, subscriptions and library.
