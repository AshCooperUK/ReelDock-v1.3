# SEPARATE V1.3 INSTALLATION. Fresh project-local data; no existing mounts.
# Independent namespaces prevent interference with other running applications.
name: reeldock-v13

x-environment: &environment
  APP_URL: ""
  APP_PORT: "8821"
  LOCAL_SETUP_URL: http://127.0.0.1:8821
  TZ: Europe/London
  DATA_DIR: /data
  REELDOCK_VPN_TRANSPORT: "1"
  LD_PRELOAD: /usr/local/lib/reeldock_socket_mark.so
  REELDOCK_MEDIA_ROOT: /reeldock
  # Fixed children: Auto-Download, TV Shows, Movies, VOD TV Shows, VOD Movies,
  # YouTube Subscriptions, YouTube Downloads. Change the host bind below only.
  # Optional common root as seen inside Emby, for automatic library setup:
  REELDOCK_EMBY_ROOT: ""
  REELDOCK_STORAGE_ROOTS: '["/reeldock"]'
  REELDOCK_HOST_ROOT: ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media

x-volumes: &volumes
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/data:/data
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media:/reeldock

services:
  prepare-storage:
    image: reeldock:1.3-development
    build: .
    user: "0:0"
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - "import os; [os.chown(p,10001,10001) for p in ('/data','/reeldock')]; os.chmod('/data',0o700)"
    volumes: *volumes
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
  vpn:
    image: reeldock:1.3-development
    build: .
    command: ["python", "-m", "runtime.vpn.gateway"]
    container_name: reeldock-v13-vpn
    user: "0:0"
    restart: unless-stopped
    ports: ["127.0.0.1:8821:8790"]
    dns: ["127.0.0.1"]
    environment:
      REELDOCK_PRIVADO_API_KEY: "${REELDOCK_PRIVADO_API_KEY:-}"
    volumes:
      - vpn-state:/vpn-state
      - vpn-run:/vpn-run
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/vpn-run/control.sock'); s.sendall(b'{\"action\":\"status\"}\\n'); assert s.recv(65536)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  web:
    image: reeldock:1.3-development
    build: .
    container_name: reeldock-v13-web
    restart: unless-stopped
    network_mode: "service:vpn"
    environment: *environment
    volumes:
      - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/data:/data
      - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media:/reeldock
      - vpn-run:/vpn-run:ro
    depends_on:
      vpn:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  worker:
    image: reeldock:1.3-development
    build: .
    container_name: reeldock-v13-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    network_mode: "service:vpn"
    environment: *environment
    volumes:
      - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/data:/data
      - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media:/reeldock
      - vpn-run:/vpn-run:ro
    depends_on:
      vpn:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sqlite3, time; from pathlib import Path;
          path = Path(os.environ.get('DATA_DIR', '/data')) / 'reeldock.sqlite3';
          db = sqlite3.connect(path.resolve().as_uri() + '?mode=ro', uri=True, timeout=2);
          row = db.execute("SELECT value FROM settings WHERE key='worker_heartbeat'").fetchone();
          db.close();
          assert row and float(row[0]) > time.time() - 120, 'Worker heartbeat is missing or stale'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  vpn-state:
  vpn-run:

x-casaos:
  main: web
  architectures: [amd64]
  scheme: http
  hostname: 127.0.0.1
  port_map: "8821"
  index: /app/
  icon: http://127.0.0.1:8821/preview/assets/reeldock-brand.svg
  title:
    en_US: ReelDock V1.3
  category: Development
  version: v1.3.10
  tagline:
    en_US: Your media. In one place.
  description:
    en_US: Separate ReelDock V1.3 installation with its own account, settings and media.
