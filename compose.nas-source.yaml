# Portable source build with its own data and media folders.
# Set REELDOCK_INSTALL_DIR before starting; edit host port, APP_PORT and LOCAL_SETUP_URL together.
name: reeldock-v13

x-app-environment: &app-environment
  APP_URL: ""
  # Host-side port; the container itself always listens on 8790.
  APP_PORT: "8821"
  LOCAL_SETUP_URL: http://127.0.0.1:8821
  REELDOCK_HOST_ROOT: ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media
  REELDOCK_STORAGE_ROOTS: '["/reeldock"]'
  DATA_DIR: /data
  REELDOCK_VPN_TRANSPORT: "1"
  LD_PRELOAD: /usr/local/lib/reeldock_socket_mark.so
  MEDIA_DIR: /media
  M3U_DIR: /m3u
  MEDIA_HOST_DIR: ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media/YouTube
  TZ: Europe/London
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

x-app-volumes: &app-volumes
  - vpn-run:/vpn-run:ro
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media:/reeldock
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/data:/data
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media/YouTube:/media
  - ${REELDOCK_INSTALL_DIR:-/DATA/AppData/reeldock-v13}/media/M3U:/m3u

services:
  vpn:
    image: reeldock:1.3-development
    build: .
    container_name: reeldock-v13-vpn
    user: "0:0"
    restart: unless-stopped
    command: ["python", "-m", "runtime.vpn.gateway"]
    ports: ["127.0.0.1:8821:8790"]
    dns: ["127.0.0.1"]
    environment:
      REELDOCK_PRIVADO_API_KEY: "${REELDOCK_PRIVADO_API_KEY:-}"
    volumes:
      - vpn-state:/vpn-state
      - vpn-run:/vpn-run
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/vpn-run/control.sock'); s.sendall(b'{\"action\":\"status\"}\\n'); assert s.recv(65536)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  web:
    image: reeldock:1.3-development
    build: .
    container_name: reeldock-v13-web
    restart: unless-stopped
    network_mode: "service:vpn"
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      vpn:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1.00"

  worker:
    image: reeldock:1.3-development
    build: .
    container_name: reeldock-v13-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    network_mode: "service:vpn"
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      vpn:
        condition: service_healthy
      web:
        condition: service_healthy
      prepare-storage:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: "1.00"

  prepare-storage:
    image: reeldock:1.3-development
    build: .
    user: "0:0"
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - "import os; [os.chown(p, 10001, 10001) for p in ('/reeldock', '/data', '/media', '/m3u')]; os.chmod('/data', 0o700); os.chmod('/media', 0o755); os.chmod('/m3u', 0o755)"
    volumes: *app-volumes
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]

volumes:
  vpn-state:
  vpn-run:

x-casaos:
  architectures: [amd64]
  icon: http://127.0.0.1:8821/preview/assets/reeldock-brand.svg
  main: web
  port_map: "8821"
  scheme: http
  index: /setup
  title:
    en_US: ReelDock V1.3
  category: Media
  version: v1.3.8
  tagline:
    en_US: Your media. In one place.
  description:
    en_US: ReelDock media discovery, downloads, TV guide, subscriptions and library.
